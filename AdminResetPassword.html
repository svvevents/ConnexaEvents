<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: <?!= branding.primaryColor ?>;
      --navy-color: <?!= branding.navyColor ?>;
      --font-family: <?!= branding.fontFamily ?>;
      --border-color: #dfe3ea;
      --text-dark: var(--navy-color);
      --text-muted: <?!= branding.mutedTextColor ?>;
      --success-color: <?!= branding.successColor ?>;
      --warning-color: <?!= branding.warningColor ?>;
      --error-color: <?!= branding.errorColor ?>;
    }
    * { box-sizing: border-box; }
    body { font-family: var(--font-family); background: <?!= branding.pageBgColor ?>; margin: 0; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .card { background: white; border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; max-width: 420px; width: 100%; box-shadow: 0 8px 30px rgba(13,27,42,0.10); }
    h2 { margin-top: 0; color: var(--navy-color); font-weight: 800; }
    label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; color: var(--navy-color); }
    input { width: 100%; padding: 10px 12px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; font-family: var(--font-family); background: #fbfcfe; }
    input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(28,114,147,0.15); }
    button { width: 100%; margin-top: 20px; background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--font-family); transition: background .15s ease; }
    button:hover { background: var(--navy-color); }
    .msg { padding: 10px 12px; border-radius: 8px; margin-top: 16px; font-size: 13px; }
    .msg.error { background: #F9EBEA; color: var(--error-color); }
    .msg.success { background: #EAF2EF; color: var(--success-color); }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset Admin Password</h2>
    <p style="font-size:13px; color:#5f6b7a;">Resetting password for <strong><?= email ?></strong></p>

    <label>New Password</label>
    <input type="password" id="newPassword" placeholder="At least 8 characters">
    <label>Confirm New Password</label>
    <input type="password" id="confirmPassword" placeholder="Re-enter password">

    <div id="resetMsg" class="msg" style="display:none;"></div>
    <button id="btnReset">Reset Password</button>
  </div>

  <script>
    // JSON.stringify (server-side) rather than the HTML-escaped print
    // scriptlet used elsewhere in this file — email/token here are
    // unvalidated URL params reflected straight into an inline <script>
    // block, and JSON.stringify is the encoding that's actually correct
    // for a JS string-literal context (HTML-escaping happening to be safe
    // here today relies on a browser-parsing coincidence, not a
    // deliberate guarantee — see the QA audit's Module 1 note).
    var email = <?!= JSON.stringify(email) ?>;
    var token = <?!= JSON.stringify(token) ?>;

    document.getElementById('btnReset').addEventListener('click', function() {
      var pw = document.getElementById('newPassword').value;
      var confirm = document.getElementById('confirmPassword').value;
      var msgEl = document.getElementById('resetMsg');
      var btn = document.getElementById('btnReset');
      msgEl.style.display = 'none';

      if (pw !== confirm) {
        msgEl.className = 'msg error'; msgEl.textContent = 'Passwords do not match.'; msgEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function() {
          msgEl.className = 'msg success';
          msgEl.textContent = 'Password reset successfully. You can now close this tab and log in.';
          msgEl.style.display = 'block';
          btn.style.display = 'none';
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          msgEl.className = 'msg error';
          msgEl.textContent = err.message;
          msgEl.style.display = 'block';
        })
        .resetAdminPassword(email, token, pw);
    });
  </script>
</body>
</html>
